<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kestrel-7 Můstek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--c:#3ef0ff;--dim:rgba(62,240,255,.35);--bg:#02040a;--warn:#ff4d5e}
body.alert{--c:#ff5c6c;--dim:rgba(255,77,94,.45)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--c);font-family:'Share Tech Mono',monospace;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#vignette{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 180px rgba(0,0,0,.8)}
body.alert #vignette{animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:inset 0 0 160px rgba(255,0,40,.25)}50%{box-shadow:inset 0 0 320px rgba(255,0,40,.6)}}
.scanlines{position:fixed;inset:0;pointer-events:none;opacity:.06;background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}
.hud{position:fixed;inset:0;pointer-events:none;transition:opacity .6s}
body.hidehud .hud{opacity:0}
body.hidehud .hud *{pointer-events:none!important}
.top{position:absolute;top:18px;left:24px;right:24px;display:flex;justify-content:space-between;align-items:flex-start}
.title{font-family:Orbitron;font-weight:900;letter-spacing:.4em;font-size:clamp(16px,1.8vw,30px);text-shadow:0 0 14px var(--c)}
.sub{font-size:12px;letter-spacing:.28em;opacity:.65;margin-top:6px;text-transform:uppercase}
.clock{font-family:Orbitron;font-weight:700;font-size:clamp(22px,2.6vw,44px);text-align:right;text-shadow:0 0 14px var(--c)}
.panel{position:absolute;border:1px solid var(--dim);background:linear-gradient(180deg,rgba(10,30,55,.45),rgba(4,10,24,.25));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:14px 16px;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));transition:border-color .4s}
.panel h3{font-family:Orbitron;font-size:11px;font-weight:700;letter-spacing:.3em;margin-bottom:12px;opacity:.9}
.left{left:24px;top:150px;width:260px}
.right{right:24px;top:150px;width:330px;height:300px;overflow:hidden}
.row{margin-bottom:11px;font-size:12px}
.row .lab{display:flex;justify-content:space-between}
.row .lab span:first-child{opacity:.7}
.bar{height:5px;background:rgba(255,255,255,.07);margin-top:5px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--c);box-shadow:0 0 10px var(--c);transition:width .5s,background .4s}
#log div{font-size:12px;line-height:1.45;margin-bottom:4px;opacity:.9}
#log div.w{color:var(--warn)}
#log div.ok{color:#7dffb4}
.banner{position:absolute;top:96px;left:50%;transform:translateX(-50%);font-family:Orbitron;font-weight:900;letter-spacing:.4em;font-size:clamp(16px,1.6vw,26px);color:var(--warn);text-shadow:0 0 18px var(--warn);opacity:0;white-space:nowrap}
body.alert .banner{animation:blink 1s steps(2) infinite}
@keyframes blink{0%{opacity:1}100%{opacity:.15}}

/* ---------- 3D tlačítka nahoře ---------- */
.tools{position:absolute;top:108px;right:24px;display:flex;gap:10px;pointer-events:auto}
.tools button{font-family:'Share Tech Mono';font-size:12px;letter-spacing:.15em;color:var(--c);cursor:pointer;padding:7px 12px;border-radius:8px;
  background:linear-gradient(180deg,#2e3a50,#131a28);border:1px solid rgba(255,255,255,.08);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -2px 3px rgba(0,0,0,.5),0 4px 0 #05080f,0 8px 14px rgba(0,0,0,.6);
  text-shadow:0 0 6px var(--c);transition:transform .1s,box-shadow .1s,filter .2s}
.tools button:hover{filter:brightness(1.2)}
.tools button:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 1px 0 #05080f,0 3px 6px rgba(0,0,0,.6)}

/* ---------- 3D spínače ---------- */
.deck{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);display:flex;gap:18px;pointer-events:auto;perspective:1000px}
.sw{--a:#3ef0ff;position:relative;width:clamp(122px,9.4vw,158px);padding:13px 12px 14px;text-align:center;cursor:pointer;border-radius:14px;
  background:
    radial-gradient(circle at 10px 10px,#a3b0c4 0 1.6px,#161c28 2.3px,transparent 3.4px),
    radial-gradient(circle at calc(100% - 10px) 10px,#a3b0c4 0 1.6px,#161c28 2.3px,transparent 3.4px),
    radial-gradient(circle at 10px calc(100% - 10px),#a3b0c4 0 1.6px,#161c28 2.3px,transparent 3.4px),
    radial-gradient(circle at calc(100% - 10px) calc(100% - 10px),#a3b0c4 0 1.6px,#161c28 2.3px,transparent 3.4px),
    linear-gradient(165deg,#36435c 0%,#1a2234 38%,#0c111c 100%);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -4px 8px rgba(0,0,0,.55),0 9px 0 #05080f,0 10px 0 rgba(120,160,220,.08),0 20px 30px rgba(0,0,0,.75);
  transform:rotateX(14deg);transform-origin:50% 100%;transition:transform .12s,box-shadow .2s,filter .2s}
.sw:hover{filter:brightness(1.15)}
.sw:active{transform:rotateX(14deg) translateY(6px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -4px 8px rgba(0,0,0,.55),0 3px 0 #05080f,0 6px 12px rgba(0,0,0,.7)}
.sw.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -4px 8px rgba(0,0,0,.55),0 9px 0 #05080f,0 10px 0 rgba(120,160,220,.08),0 20px 30px rgba(0,0,0,.75),0 0 26px -6px var(--a)}
.sw.on:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -4px 8px rgba(0,0,0,.55),0 3px 0 #05080f,0 0 26px -6px var(--a)}
.sw .key{position:absolute;top:5px;right:22px;font-size:9px;color:#6d7a90}
.sw .code{font-size:9px;letter-spacing:.25em;color:#7f8ea6;text-shadow:0 -1px 0 #000}
.sw .name{font-family:Orbitron;font-size:11px;font-weight:700;letter-spacing:.14em;margin:6px 0 10px;padding:6px 4px;border-radius:5px;color:#8392a8;
  background:linear-gradient(180deg,#04070c,#0b111b);box-shadow:inset 0 2px 5px rgba(0,0,0,.95),0 1px 0 rgba(255,255,255,.09);text-shadow:0 -1px 0 #000;transition:color .3s,text-shadow .3s}
.sw.on .name{color:var(--a);text-shadow:0 0 8px var(--a)}
.tog{position:relative;width:70px;height:70px;margin:0 auto;border-radius:50%;
  background:radial-gradient(circle,#06090f 0 21px,#000 22px,transparent 23px),
             conic-gradient(from 210deg,#55627a,#d3dbe8,#5d6a80,#222a37,#55627a,#b4bfcf,#283040,#55627a);
  box-shadow:inset 0 0 0 4px rgba(0,0,0,.35),inset 0 2px 2px rgba(255,255,255,.35),0 4px 8px rgba(0,0,0,.8)}
.tog::before{content:"";position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;z-index:2;
  background:radial-gradient(circle at 40% 35%,#eef3fa,#8592a8 45%,#272f3e 88%);box-shadow:0 0 0 2px #0e131c,0 2px 4px #000}
.tog .zap,.tog .vyp{position:absolute;right:-27px;font-size:8px;letter-spacing:.1em;color:#6a778c;text-shadow:0 -1px 0 #000}
.tog .zap{top:4px}.tog .vyp{bottom:4px}
.sw.on .tog .zap{color:var(--a);text-shadow:0 0 6px var(--a)}
.bat{position:absolute;left:50%;top:50%;width:10px;height:31px;margin:-31px 0 0 -5px;z-index:1;transform-origin:50% 100%;border-radius:5px 5px 2px 2px;
  background:linear-gradient(90deg,#3a4354,#f1f5fb 35%,#a8b3c5 58%,#454f61);
  transform:perspective(140px) rotateX(-160deg);transition:transform .34s cubic-bezier(.4,1.7,.5,1)}
.bat::after{content:"";position:absolute;left:50%;top:-8px;width:17px;height:17px;margin-left:-8.5px;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#fff,#aeb9ca 35%,#363f4e 82%);box-shadow:0 2px 3px rgba(0,0,0,.6);transition:background .3s,box-shadow .3s}
.sw.on .bat{transform:perspective(140px) rotateX(-18deg)}
.sw.on .bat::after{background:radial-gradient(circle at 38% 32%,#fff,var(--a) 42%,#081419 96%);box-shadow:0 0 12px var(--a),0 0 3px var(--a)}
.st{font-size:10px;letter-spacing:.18em;margin-top:11px;color:#8b98ad;display:flex;align-items:center;justify-content:center;gap:8px}
.lamp{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6b4a50,#2a1418 60%,#120709);box-shadow:0 0 0 2px #0b1019,0 0 0 3px #3b4660;transition:.3s}
.sw.on .lamp{background:radial-gradient(circle at 35% 30%,#fff 0,var(--a) 45%,#000 130%);box-shadow:0 0 0 2px #0b1019,0 0 0 3px #3b4660,0 0 10px var(--a),0 0 22px var(--a)}
.sw.on .st{color:var(--a)}
.sw.deny{animation:deny .5s}
@keyframes deny{0%,100%{transform:rotateX(14deg)}20%{transform:rotateX(14deg) translateX(-6px)}40%{transform:rotateX(14deg) translateX(6px)}60%{transform:rotateX(14deg) translateX(-4px)}80%{transform:rotateX(14deg) translateX(3px)}}
@media (max-width:900px){.left,.right{display:none}.deck{transform:translateX(-50%) scale(.62);transform-origin:50% 100%;bottom:10px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>
<div class="scanlines"></div>

<div class="hud">
  <div class="top">
    <div>
      <div class="title">KESTREL-7</div>
      <div class="sub">Orbitální stanice · sektor 7G · dráha Proxima b</div>
    </div>
    <div>
      <div class="clock" id="clock">00:00:00</div>
      <div class="sub" id="date" style="text-align:right"></div>
    </div>
  </div>

  <div class="banner">⚠ ČERVENÝ POPLACH ⚠</div>

  <div class="tools">
    <button id="snd">♪ ZVUK: VYP</button>
    <button id="fs" title="Celá obrazovka">⛶</button>
    <button id="hide" title="Skrýt panely (dvojklik nebo H vrátí)">◐</button>
  </div>

  <div class="panel left">
    <h3>TELEMETRIE</h3>
    <div class="row"><div class="lab"><span>VÝKON REAKTORU</span><span id="v-pwr">0 %</span></div><div class="bar"><i id="b-pwr"></i></div></div>
    <div class="row"><div class="lab"><span>INTEGRITA ŠTÍTŮ</span><span id="v-shd">0 %</span></div><div class="bar"><i id="b-shd"></i></div></div>
    <div class="row"><div class="lab"><span>RYCHLOST</span><span id="v-spd">0 c</span></div><div class="bar"><i id="b-spd"></i></div></div>
    <div class="row"><div class="lab"><span>TEPLOTA JÁDRA</span><span id="v-tmp">0 K</span></div><div class="bar"><i id="b-tmp"></i></div></div>
    <div class="row"><div class="lab"><span>UMĚLÁ GRAVITACE</span><span id="v-grv">0 g</span></div><div class="bar"><i id="b-grv"></i></div></div>
    <div class="row"><div class="lab"><span>KYSLÍK</span><span id="v-o2">0 %</span></div><div class="bar"><i id="b-o2"></i></div></div>
    <div class="row"><div class="lab"><span>POSÁDKA NA PALUBĚ</span><span id="v-crew">142</span></div></div>
  </div>

  <div class="panel right">
    <h3>SYSTÉMOVÝ ZÁZNAM</h3>
    <div id="log"></div>
  </div>

  <div class="deck" id="deck"></div>
</div>

<script>
(()=>{
/* ================= STAV ================= */
const S={reactor:false,shield:false,warp:false,scan:false,alert:false};
try{const s=JSON.parse(localStorage.getItem('kestrel7')||'{}');for(const k in S)if(typeof s[k]==='boolean')S[k]=s[k];}catch(e){}
function save(){try{localStorage.setItem('kestrel7',JSON.stringify(S));}catch(e){}}

const SW=[
  {k:'reactor',code:'PWR-01',name:'REAKTOR',   col:'#3ef0ff'},
  {k:'shield', code:'DEF-02',name:'ŠTÍTY',     col:'#9b86ff'},
  {k:'warp',   code:'NAV-03',name:'HYPERPOHON',col:'#e6f3ff'},
  {k:'scan',   code:'SEN-04',name:'SKENER',    col:'#4dff9a'},
  {k:'alert',  code:'SEC-05',name:'POPLACH',   col:'#ff4d5e'}
];
const MSG={
  reactor:[['Zážeh fúzního jádra… plazma stabilní','ok'],['Reaktor odstaven – přechod na nouzové napájení','w']],
  shield:[['Deflektorové štíty aktivní – pokrytí 100 %','ok'],['Štíty deaktivovány','']],
  warp:[['Hyperpohon: skok zahájen, kurz 214.7','ok'],['Návrat do normálního prostoru','']],
  scan:[['Dálkový skener online – sken povrchu a sekvenace DNA','ok'],['Skener v pohotovostním režimu','']],
  alert:[['ČERVENÝ POPLACH – posádka na stanoviště!','w'],['Poplach odvolán, stav normální','ok']]
};

/* ================= UI ================= */
const deck=document.getElementById('deck');
const swEl={};
SW.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='sw';d.style.setProperty('--a',s.col);
  d.innerHTML=`<span class="key">${i+1}</span><div class="code">${s.code}</div><div class="name">${s.name}</div>`+
    `<div class="tog"><span class="zap">ZAP</span><span class="vyp">VYP</span><div class="bat"></div></div>`+
    `<div class="st"><span class="lamp"></span><span class="tx"></span></div>`;
  d.addEventListener('click',()=>toggle(s.k));
  deck.appendChild(d);swEl[s.k]=d;
});
function refreshUI(){
  SW.forEach(s=>{const d=swEl[s.k];d.classList.toggle('on',S[s.k]);d.querySelector('.tx').textContent=S[s.k]?'AKTIVNÍ':'PŘIPRAVEN';});
  document.body.classList.toggle('alert',S.alert);
}
const logEl=document.getElementById('log');
function log(t,cls){
  const d=document.createElement('div');if(cls)d.className=cls;
  const tm=new Date().toLocaleTimeString('cs-CZ');
  d.textContent=`[${tm}] `;logEl.appendChild(d);
  let i=0;const iv=setInterval(()=>{d.textContent+=t[i++]||'';if(i>=t.length)clearInterval(iv);},18);
  while(logEl.children.length>9)logEl.removeChild(logEl.firstChild);
}
function toggle(k){
  if(k==='warp'&&!S.warp&&!S.reactor){
    log('Hyperpohon: NEDOSTATEK ENERGIE – nejdřív zapni reaktor','w');
    swEl.warp.classList.remove('deny');void swEl.warp.offsetWidth;swEl.warp.classList.add('deny');
    tone(160,.25,'square',.05,90);return;
  }
  S[k]=!S[k];
  if(k==='reactor'&&!S.reactor&&S.warp){S.warp=false;log('Hyperpohon nouzově vypnut – ztráta energie','w');}
  const m=MSG[k][S[k]?0:1];log(m[0],m[1]);
  if(k==='warp'&&S.warp)flash=1;
  if(k==='shield'&&S.shield)shieldRipple=0;
  refreshUI();save();sfx(k);setHum();
}
addEventListener('keydown',e=>{
  const n=parseInt(e.key);if(n>=1&&n<=5)toggle(SW[n-1].k);
  if(e.key==='h'||e.key==='H')document.body.classList.toggle('hidehud');
  if(e.key==='f'||e.key==='F')fullscreen();
});
addEventListener('dblclick',e=>{if(e.target.closest('.sw,button'))return;document.body.classList.toggle('hidehud');});
document.getElementById('hide').onclick=()=>document.body.classList.add('hidehud');
function fullscreen(){const d=document.documentElement;if(!document.fullscreenElement)(d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d);else document.exitFullscreen();}
document.getElementById('fs').onclick=fullscreen;

/* ================= ZVUK ================= */
let AC=null,sound=false,hum=null;
const sndBtn=document.getElementById('snd');
sndBtn.onclick=()=>{
  sound=!sound;
  if(sound){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}
  sndBtn.textContent='♪ ZVUK: '+(sound?'ZAP':'VYP');setHum();
};
function tone(f,d,type='sine',v=.08,f2){
  if(!sound||!AC)return;const t=AC.currentTime;
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.05);
}
function sfx(k){
  tone(1800,.05,'square',.03);tone(120,.08,'triangle',.06);
  if(k==='reactor')S.reactor?tone(60,1.8,'sawtooth',.08,240):tone(240,1.5,'sawtooth',.06,40);
  if(k==='shield')S.shield?(tone(300,.7,'sine',.08,900),tone(450,.7,'sine',.05,1350)):tone(800,.5,'sine',.06,200);
  if(k==='warp')S.warp?tone(70,2.2,'sawtooth',.09,1200):tone(900,1.2,'sawtooth',.06,60);
  if(k==='scan'&&S.scan)tone(1400,.3,'sine',.06);
}
function setHum(){
  const want=sound&&AC&&S.reactor;
  if(want&&!hum){
    const t=AC.currentTime,o=AC.createOscillator(),o2=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();
    o.type='sawtooth';o.frequency.value=55;o2.type='sine';o2.frequency.value=110.6;
    f.type='lowpass';f.frequency.value=200;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+1.5);
    o.connect(f);o2.connect(f);f.connect(g).connect(AC.destination);o.start();o2.start();hum={o,o2,g};
  }else if(!want&&hum){
    const h=hum;hum=null;if(AC){const t=AC.currentTime;h.g.gain.cancelScheduledValues(t);h.g.gain.setValueAtTime(h.g.gain.value,t);h.g.gain.linearRampToValueAtTime(0,t+.8);}
    setTimeout(()=>{try{h.o.stop();h.o2.stop();}catch(e){}},900);
  }
}
setInterval(()=>{if(S.alert&&sound){tone(880,.4,'square',.035,620);setTimeout(()=>tone(880,.4,'square',.035,620),500);}},1500);

/* ================= CANVAS ================= */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const TAU=Math.PI*2,TILT=.32,LIGHT=-2.3;
let W,H,DPR,ST={},bgNeb,bgPlan,hexes=[],stars=[],PL={};
const rand=(a,b)=>a+Math.random()*(b-a);

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  const m=Math.min(W,H);
  ST={cx:W*0.48,cy:H*0.47,R:m*0.26};
  buildNebula();buildPlanet();buildHex();
  if(!stars.length)for(let i=0;i<950;i++)stars.push(newStar(true));
}
function mkCanvas(){const c=document.createElement('canvas');c.width=W*DPR;c.height=H*DPR;const x=c.getContext('2d');x.setTransform(DPR,0,0,DPR,0,0);return[c,x];}

function buildNebula(){
  const[c,x]=mkCanvas();bgNeb=c;
  const g0=x.createLinearGradient(0,0,0,H);g0.addColorStop(0,'#03050f');g0.addColorStop(1,'#060314');x.fillStyle=g0;x.fillRect(0,0,W,H);
  x.globalCompositeOperation='lighter';
  const blobs=[[.18,.3,.55,'120,40,210',.20],[.72,.18,.42,'0,150,220',.14],[.45,.85,.5,'210,30,130',.09],[.9,.5,.35,'60,90,255',.10],[.3,.65,.3,'0,200,180',.06]];
  blobs.forEach(([bx,by,br,col,a])=>{const g=x.createRadialGradient(W*bx,H*by,0,W*bx,H*by,W*br);g.addColorStop(0,`rgba(${col},${a})`);g.addColorStop(.5,`rgba(${col},${a*.35})`);g.addColorStop(1,`rgba(${col},0)`);x.fillStyle=g;x.fillRect(0,0,W,H);});
  // jemné cáry mlhoviny
  for(let i=0;i<60;i++){
    const px=rand(0,W),py=rand(0,H),r=rand(40,180),col=Math.random()<.5?'140,80,255':'40,180,255';
    const g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,`rgba(${col},${rand(.01,.035)})`);g.addColorStop(1,`rgba(${col},0)`);
    x.fillStyle=g;x.beginPath();x.ellipse(px,py,r*2.2,r*.6,rand(-.8,.2),0,TAU);x.fill();
  }
  for(let i=0;i<4000;i++){
    const t=Math.random(),off=(Math.random()+Math.random()+Math.random()-1.5)*H*0.16;
    const px=t*W*1.2-W*0.1,py=H*0.95-t*H*0.9+off;
    x.fillStyle=`rgba(${200+rand(0,55)|0},${200+rand(0,55)|0},255,${rand(.04,.35)})`;
    const s=Math.random()<.97?.7:1.4;x.fillRect(px,py,s,s);
  }
  for(let i=0;i<1200;i++){x.fillStyle=`rgba(255,255,255,${rand(.05,.5)})`;x.fillRect(rand(0,W),rand(0,H),.8,.8);}
  x.globalCompositeOperation='source-over';
}

function buildPlanet(){
  const[c,x]=mkCanvas();bgPlan=c;const m=Math.min(W,H);
  const px=W*0.88,py=H*1.13,pr=m*0.72;PL={px,py,pr};
  let g=x.createRadialGradient(px,py,pr*.96,px,py,pr*1.14);g.addColorStop(0,'rgba(90,190,255,.55)');g.addColorStop(.4,'rgba(60,140,255,.18)');g.addColorStop(1,'rgba(60,140,255,0)');
  x.fillStyle=g;x.beginPath();x.arc(px,py,pr*1.14,0,TAU);x.fill();
  g=x.createRadialGradient(px-pr*.45,py-pr*.55,pr*.05,px,py,pr);
  g.addColorStop(0,'#6cc4f0');g.addColorStop(.3,'#2468a3');g.addColorStop(.7,'#0c2a4c');g.addColorStop(1,'#030b18');
  x.fillStyle=g;x.beginPath();x.arc(px,py,pr,0,TAU);x.fill();
  x.save();x.beginPath();x.arc(px,py,pr,0,TAU);x.clip();
  for(let i=0;i<22;i++){x.globalAlpha=rand(.04,.12);x.fillStyle=i%2?'#bfeaff':'#06152b';x.beginPath();x.ellipse(px+rand(-40,40),py-pr*.98+i*pr*.09,pr*1.35,rand(pr*.01,pr*.04),-.14,0,TAU);x.fill();}
  for(let i=0;i<70;i++){x.globalAlpha=rand(.03,.09);x.fillStyle='#fff';x.beginPath();x.ellipse(px+rand(-pr,pr*.2),py+rand(-pr,-pr*.1),rand(20,90),rand(4,14),-.14+rand(-.1,.1),0,TAU);x.fill();}
  x.globalAlpha=1;
  for(let i=0;i<260;i++){const a=rand(-2.6,-1.0),r=pr*rand(.55,.98);const cx=px+Math.cos(a)*r,cy=py+Math.sin(a)*r;if(cx-px>-pr*.1){x.fillStyle=`rgba(255,${180+rand(0,60)|0},90,${rand(.15,.6)})`;x.fillRect(cx,cy,1.2,1.2);}}
  g=x.createRadialGradient(px+pr*.55,py+pr*.25,pr*.1,px+pr*.35,py+pr*.15,pr*1.25);g.addColorStop(0,'rgba(0,0,10,.9)');g.addColorStop(.6,'rgba(0,0,10,.5)');g.addColorStop(1,'rgba(0,0,10,0)');
  x.fillStyle=g;x.fillRect(0,0,W,H);x.restore();
  x.strokeStyle='rgba(160,230,255,.7)';x.lineWidth=2;x.beginPath();x.arc(px,py,pr,Math.PI*1.02,Math.PI*1.42);x.stroke();
  const mx=W*0.29,my=H*0.17,mr=m*0.04;
  g=x.createRadialGradient(mx-mr*.4,my-mr*.4,mr*.1,mx,my,mr);g.addColorStop(0,'#d8d4cc');g.addColorStop(.6,'#7b7670');g.addColorStop(1,'#1a1816');
  x.fillStyle=g;x.beginPath();x.arc(mx,my,mr,0,TAU);x.fill();
  x.save();x.beginPath();x.arc(mx,my,mr,0,TAU);x.clip();
  for(let i=0;i<9;i++){x.fillStyle='rgba(40,35,30,.35)';x.beginPath();x.arc(mx+rand(-mr,mr)*.7,my+rand(-mr,mr)*.7,rand(mr*.06,mr*.2),0,TAU);x.fill();}
  x.fillStyle='rgba(0,0,8,.55)';x.beginPath();x.arc(mx+mr*.55,my+mr*.45,mr*1.05,0,TAU);x.fill();x.restore();
}

function buildHex(){
  hexes=[];const R=ST.R,rx=R*1.45,ry=R*1.12,s=R*.085,w=Math.sqrt(3)*s,h=1.5*s;
  for(let r=-Math.ceil(ry/h)-1;r<=Math.ceil(ry/h)+1;r++)for(let c=-Math.ceil(rx/w)-1;c<=Math.ceil(rx/w)+1;c++){
    const x=c*w+(r&1?w/2:0),y=r*h;if((x/rx)**2+(y/ry)**2<1.15)hexes.push({x,y,ph:Math.random()*6.28});
  }
  ST.hs=s;ST.rx=rx;ST.ry=ry;
}

function newStar(init){return{x:rand(-1,1)*W,y:rand(-1,1)*H,z:init?rand(.05,1):1,tw:rand(0,6.28),hue:Math.random()<.15?'255,220,190':(Math.random()<.2?'180,210,255':'255,255,255')};}

/* animované hodnoty */
let reactA=+S.reactor,shieldA=+S.shield,warpA=+S.warp,scanA=+S.scan,alertA=+S.alert;
let speed=S.warp?.03:.00025,rot=0,rot2=0,sweep=0,flash=0,shieldRipple=9,dnaRot=0,dnaSeq=37.4;
const blips=[];for(let i=0;i<9;i++)blips.push({a:rand(0,6.28),r:rand(.35,.95),life:0,id:'OBJ-'+(10+Math.random()*89|0)});
const ships=[];let nextShip=3;
const lerp=(a,b,k,dt)=>a+(b-a)*Math.min(1,dt*k);

/* ---------- kreslicí pomůcky ---------- */
function P(r,a,dy){return[ST.cx+r*Math.cos(a),ST.cy+r*TILT*Math.sin(a)+(dy||0)];}
function path(pts){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();}
function poly(pts,fill,stroke){path(pts);ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke||fill;ctx.lineWidth=.8;ctx.stroke();}
function line(p,q){ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.stroke();}
function glow(x,y,r,col,a){if(a<=0)return;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${col},${a})`);g.addColorStop(1,`rgba(${col},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}
const vis=(a,back)=>{const s=Math.sin(a);return back?s<0:s>=0;};

function drawStars(dt,t){
  const cx=W/2,cy=H/2,warp=speed>.004;
  ctx.lineCap='round';
  for(const s of stars){
    s.z-=speed*dt*60;
    if(s.z<=.02){Object.assign(s,newStar(false));continue;}
    const sx=cx+s.x/s.z*.5,sy=cy+s.y/s.z*.5;
    if(sx<-50||sx>W+50||sy<-50||sy>H+50){Object.assign(s,newStar(false));continue;}
    const sz=(1-s.z)*1.8+.35,b=Math.min(1,(1-s.z)*1.3+.15)*(.75+.25*Math.sin(t*2+s.tw));
    if(warp){
      const tz=s.z+speed*14,tx=cx+s.x/tz*.5,ty=cy+s.y/tz*.5;
      ctx.strokeStyle=`rgba(${s.hue},${b})`;ctx.lineWidth=sz;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(sx,sy);ctx.stroke();
    }else{ctx.fillStyle=`rgba(${s.hue},${b})`;ctx.fillRect(sx,sy,sz,sz);}
  }
}

/* ---------- DNA hologram ---------- */
function drawDNA(dt,t){
  const x0=Math.max(120,Math.min(W*.09,190)),base=H*.87,top=Math.max(H*.48,480),len=base-top-40;
  if(len<120||W<900)return;
  dnaRot+=dt*(.6+1.5*reactA);
  if(S.scan){dnaSeq+=dt*1.8;if(dnaSeq>=100){dnaSeq=0;log('Sekvenace genomu vzorku 7G-α dokončena','ok');}}
  const hc=S.alert?'255,90,110':'90,240,255',A=38,ew=60;
  // projektor
  ctx.fillStyle='#070b12';ctx.beginPath();ctx.ellipse(x0,base+10,ew,ew*.3,0,0,TAU);ctx.fill();
  let g=ctx.createLinearGradient(x0-ew,0,x0+ew,0);g.addColorStop(0,'#141b28');g.addColorStop(.38,'#6a7c9c');g.addColorStop(.55,'#2c3850');g.addColorStop(1,'#0b1019');
  ctx.fillStyle=g;ctx.fillRect(x0-ew,base,ew*2,10);
  ctx.beginPath();ctx.ellipse(x0,base+10,ew,ew*.3,0,0,Math.PI);ctx.fill();
  g=ctx.createRadialGradient(x0-ew*.3,base-6,2,x0,base,ew);g.addColorStop(0,'#8ea2c2');g.addColorStop(1,'#1d2637');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x0,base,ew,ew*.3,0,0,TAU);ctx.fill();
  ctx.fillStyle='#05080e';ctx.beginPath();ctx.ellipse(x0,base,ew*.62,ew*.62*.3,0,0,TAU);ctx.fill();
  for(let i=0;i<12;i++){const a=i/12*TAU+t*.4,px=x0+Math.cos(a)*ew*.82,py=base+Math.sin(a)*ew*.82*.3;ctx.fillStyle=`rgba(${hc},${.3+.7*(Math.sin(t*4+i)>0)})`;ctx.fillRect(px-1,py-1,2,2);}
  ctx.save();ctx.globalCompositeOperation='lighter';
  glow(x0,base,ew*.7,hc,.5);
  ctx.strokeStyle=`rgba(${hc},.9)`;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x0,base,ew*.55,ew*.55*.3,0,0,TAU);ctx.stroke();
  // kužel světla
  g=ctx.createLinearGradient(0,base,0,top-20);g.addColorStop(0,`rgba(${hc},.2)`);g.addColorStop(1,`rgba(${hc},0)`);
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x0-ew*.55,base);ctx.lineTo(x0-A*2.1,top-20);ctx.lineTo(x0+A*2.1,top-20);ctx.lineTo(x0+ew*.55,base);ctx.closePath();ctx.fill();
  const fl=.85+.15*Math.sin(t*23)*Math.sin(t*7);
  const y0=base-36,N=28,step=len/(N-1),PH=.48;
  const scanY=S.scan?y0-((t*.3)%1)*len:-9999;
  const pairs=[['80,220,255','255,90,200'],['120,255,140','255,190,70'],['255,90,200','80,220,255'],['255,190,70','120,255,140']];
  // páteře (jemně vzorkované)
  for(const sg of [1,-1]){
    let prev=null;
    for(let f=0;f<=N-1;f+=.2){
      const ph=f*PH+dnaRot,x=x0+sg*A*Math.sin(ph),y=y0-f*step,z=sg*Math.cos(ph);
      if(prev){const d=(z+1)/2;ctx.strokeStyle=`rgba(${hc},${(.15+.65*d)*fl})`;ctx.lineWidth=1+2.2*d;ctx.beginPath();ctx.moveTo(prev[0],prev[1]);ctx.lineTo(x,y);ctx.stroke();}
      prev=[x,y];
    }
  }
  // příčky a báze
  for(let i=0;i<N;i++){
    const ph=i*PH+dnaRot,sn=Math.sin(ph),cs=Math.cos(ph),y=y0-i*step;
    const x1=x0+A*sn,x2=x0-A*sn,mx=x0,c=pairs[i%4];
    const near=Math.abs(y-scanY)<12?1:0,al=(.35+.25*Math.abs(cs)+near*.5)*fl;
    ctx.lineWidth=2.2;
    ctx.strokeStyle=`rgba(${c[0]},${al})`;line([x1,y],[mx,y]);
    ctx.strokeStyle=`rgba(${c[1]},${al})`;line([mx,y],[x2,y]);
    for(const[xx,z]of[[x1,cs],[x2,-cs]]){const d=(z+1)/2;ctx.fillStyle=`rgba(${near?'255,255,255':hc},${(.35+.65*d)*fl})`;ctx.beginPath();ctx.arc(xx,y,1.6+2.4*d,0,TAU);ctx.fill();}
  }
  if(S.scan){ctx.strokeStyle='rgba(120,255,170,.8)';ctx.lineWidth=1.2;line([x0-A*1.8,scanY],[x0+A*1.8,scanY]);glow(x0,scanY,A*1.4,'120,255,170',.25);}
  ctx.restore();
  ctx.font='10px "Share Tech Mono"';ctx.textAlign='center';
  ctx.fillStyle=`rgba(${hc},.85)`;ctx.fillText('GENOM · VZOREK 7G-α',x0,top-28);
  ctx.fillStyle=`rgba(${hc},.6)`;ctx.fillText(`SEKVENOVÁNO ${dnaSeq.toFixed(1)} %`,x0,base+34);
  ctx.textAlign='left';
}

function drawScanner(dt,t){
  if(scanA<.01)return;
  const{cx,cy,R}=ST,rr=R*2.0;
  ctx.save();ctx.globalAlpha=scanA;ctx.translate(cx,cy);ctx.scale(1,.5);
  ctx.strokeStyle='rgba(77,255,154,.25)';ctx.lineWidth=1.2;
  for(let i=1;i<=4;i++){ctx.beginPath();ctx.arc(0,0,rr*i/4,0,TAU);ctx.stroke();}
  ctx.beginPath();ctx.moveTo(-rr,0);ctx.lineTo(rr,0);ctx.moveTo(0,-rr);ctx.lineTo(0,rr);ctx.stroke();
  for(let i=0;i<72;i++){const a=i/72*TAU,l=i%6?.03:.07;ctx.beginPath();ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);ctx.lineTo(Math.cos(a)*rr*(1-l),Math.sin(a)*rr*(1-l));ctx.stroke();}
  if(ctx.createConicGradient){
    const g=ctx.createConicGradient(sweep,0,0);g.addColorStop(0,'rgba(77,255,154,0)');g.addColorStop(.82,'rgba(77,255,154,0)');g.addColorStop(.995,'rgba(77,255,154,.45)');g.addColorStop(1,'rgba(77,255,154,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,rr,0,TAU);ctx.fill();
  }
  ctx.strokeStyle='rgba(140,255,190,.9)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(sweep)*rr,Math.sin(sweep)*rr);ctx.stroke();
  ctx.restore();
  ctx.save();ctx.globalAlpha=scanA;ctx.font='10px "Share Tech Mono"';
  for(const b of blips){
    let d=(sweep-b.a)%TAU;if(d<0)d+=TAU;if(d<.08)b.life=1;
    b.life=Math.max(0,b.life-dt*.35);if(b.life<=0)continue;
    const x=cx+Math.cos(b.a)*rr*b.r,y=cy+Math.sin(b.a)*rr*b.r*.5;
    ctx.fillStyle=`rgba(140,255,190,${b.life})`;ctx.beginPath();ctx.arc(x,y,3,0,TAU);ctx.fill();
    ctx.strokeStyle=`rgba(140,255,190,${b.life*.6})`;ctx.beginPath();ctx.arc(x,y,6+(1-b.life)*14,0,TAU);ctx.stroke();
    ctx.fillText(b.id,x+8,y-6);
  }
  const{px,py,pr}=PL,ang=Math.atan2(cy-py,cx-px),tx=px+Math.cos(ang)*pr*.93+Math.sin(t*.4)*30,ty=py+Math.sin(ang)*pr*.93;
  ctx.setLineDash([10,8]);ctx.lineDashOffset=-t*60;ctx.strokeStyle='rgba(77,255,154,.55)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(cx,cy+R*.8);ctx.lineTo(tx,ty);ctx.stroke();ctx.setLineDash([]);
  ctx.translate(tx,ty);ctx.rotate(t);ctx.strokeStyle='rgba(140,255,190,.9)';ctx.lineWidth=1.5;
  for(let i=0;i<4;i++){ctx.rotate(Math.PI/2);ctx.beginPath();ctx.arc(0,0,16,.2,1.2);ctx.stroke();}
  ctx.restore();
}

/* ---------- stanice: 3D prstenec ---------- */
function torus(R,w,th,rotA,back,o,t,lc){
  const ri=R-w/2,ro=R+w/2,n=o.seg;
  for(let i=0;i<n;i++){
    const a0=i/n*TAU,a1=(i+1)/n*TAU,am=(a0+a1)/2;if(!vis(am,back))continue;
    const L=28+16*Math.cos(am-LIGHT);
    const rr=back?ri:ro;
    poly([P(rr,a0),P(rr,a1),P(rr,a1,th),P(rr,a0,th)],`hsl(218,24%,${(L*(back?.5:.58)).toFixed(1)}%)`);
    poly([P(ri,a0),P(ro,a0),P(ro,a1),P(ri,a1)],`hsl(215,19%,${L.toFixed(1)}%)`);
  }
  // hrana a světelný pás
  ctx.strokeStyle='rgba(190,210,240,.18)';ctx.lineWidth=1;
  ctx.beginPath();ctx.ellipse(ST.cx,ST.cy,ro,ro*TILT,0,back?Math.PI:0,back?TAU:Math.PI);ctx.stroke();
  ctx.strokeStyle=`rgba(${lc},${.1+.45*reactA})`;ctx.lineWidth=1.4;
  ctx.beginPath();ctx.ellipse(ST.cx,ST.cy,R,R*TILT,0,back?Math.PI:0,back?TAU:Math.PI);ctx.stroke();
  // spáry panelů
  ctx.strokeStyle='rgba(3,6,12,.6)';ctx.lineWidth=1;
  for(let k=0;k<o.seams;k++){const a=rotA+k*TAU/o.seams;if(!vis(a,back))continue;
    line(P(ri,a),P(ro,a));const rr=back?ri:ro;line(P(rr,a),P(rr,a,th));}
  // okna ve stěně
  const rr=back?ri:ro;
  for(let j=0;j<o.nl;j++){const a=rotA+j*TAU/o.nl;if(!vis(a,back))continue;
    const lit=reactA>.5?(j%4!==0):(j%o.sparse===0),d=.35+.65*Math.abs(Math.sin(a));
    const al=d*(lit?1:.07)*(.75+.25*Math.sin(t*2.3+j*1.9))*(.35+.65*Math.max(reactA,.3));
    const p=P(rr,a,th*.5);ctx.fillStyle=`rgba(${lc},${al})`;ctx.fillRect(p[0]-1.5,p[1]-1,3,2);}
  // moduly na prstenci
  for(let k=0;k<o.mods;k++){const a=rotA+k*TAU/o.mods+.2;if(!vis(a,back))continue;
    const da=o.mw/R,hh=th*.85,r1=ri+w*.12,r2=ro-w*.12,L=33+16*Math.cos(a-LIGHT),sr=back?r1:r2;
    poly([P(sr,a-da,-hh),P(sr,a+da,-hh),P(sr,a+da),P(sr,a-da)],`hsl(216,22%,${(L*.6).toFixed(1)}%)`);
    poly([P(r1,a-da,-hh),P(r2,a-da,-hh),P(r2,a+da,-hh),P(r1,a+da,-hh)],`hsl(214,17%,${(L+8).toFixed(1)}%)`,'rgba(180,200,230,.35)');
    const c=P((r1+r2)/2,a,-hh);ctx.fillStyle=`rgba(${lc},${(.25+.75*reactA)*(Math.sin(t*3+k*2)>-.2?1:.3)})`;ctx.beginPath();ctx.arc(c[0],c[1],1.8,0,TAU);ctx.fill();
    for(let q=-1;q<=1;q+=2){const p=P(sr,a+q*da*.5,-hh*.45);ctx.fillStyle=`rgba(${lc},${(.15+.6*reactA)})`;ctx.fillRect(p[0]-1,p[1]-1,2,2);}
  }
}
function tube(p,q,w){ctx.lineCap='round';ctx.strokeStyle='#0f1622';ctx.lineWidth=w;line(p,q);ctx.strokeStyle='#4d5f7c';ctx.lineWidth=w*.35;line([p[0],p[1]-w*.22],[q[0],q[1]-w*.22]);}
function cyl(y0,y1,r){
  const cx=ST.cx,g=ctx.createLinearGradient(cx-r,0,cx+r,0);
  g.addColorStop(0,'#060a10');g.addColorStop(.28,'#34445f');g.addColorStop(.42,'#8498b8');g.addColorStop(.58,'#2e3c55');g.addColorStop(1,'#04070c');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(cx,y1,r,r*TILT,0,0,Math.PI);ctx.fill();
  ctx.fillRect(cx-r,y0,r*2,y1-y0);
  ctx.fillStyle='#62779a';ctx.beginPath();ctx.ellipse(cx,y0,r,r*TILT,0,0,TAU);ctx.fill();
  ctx.strokeStyle='rgba(170,190,220,.4)';ctx.lineWidth=1;ctx.stroke();
}
function cylRing(y,r){ctx.strokeStyle='rgba(5,8,14,.7)';ctx.lineWidth=1.4;ctx.beginPath();ctx.ellipse(ST.cx,y,r,r*TILT,0,0,Math.PI);ctx.stroke();
  ctx.strokeStyle='rgba(170,190,220,.25)';ctx.lineWidth=.8;ctx.beginPath();ctx.ellipse(ST.cx,y+1.5,r,r*TILT,0,0,Math.PI);ctx.stroke();}
function cylWindows(y,r,lc,t,n){for(let k=-n;k<=n;k++){const th=k/(n+1)*1.35,x=ST.cx+r*Math.sin(th),d=Math.cos(th);
  ctx.fillStyle=`rgba(${lc},${d*(.18+.72*reactA)*(Math.sin(t*1.7+k*3+y)>-.6?1:.2)})`;ctx.fillRect(x-1.2,y+r*TILT*d-1,2.4,1.8);}}
function sphere(x,y,r){const g=ctx.createRadialGradient(x-r*.4,y-r*.45,r*.05,x,y,r);g.addColorStop(0,'#d2deef');g.addColorStop(.25,'#6c82a4');g.addColorStop(.7,'#1c2638');g.addColorStop(1,'#04070c');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}
function solar(side,y,t){
  const cx=ST.cx,R=ST.R,yy=x=>y-Math.abs(x-cx)*.05;
  ctx.strokeStyle='#5b6b86';ctx.lineWidth=2.4;line([cx+side*R*.06,y],[cx+side*R*.9,yy(cx+side*R*.9)]);
  ctx.lineWidth=1;for(let i=0;i<10;i++){const xa=cx+side*R*(.08+i*.08),xb=cx+side*R*(.12+i*.08);line([xa,yy(xa)-3],[xb,yy(xb)+3]);}
  for(let p=0;p<2;p++){
    const xa=cx+side*R*(.12+p*.4),xb=cx+side*R*(.48+p*.4),h=R*.14,sk=side*R*.04;
    const A=[xa,yy(xa)-h/2],B=[xb,yy(xb)-h/2],C=[xb+sk,yy(xb)+h/2],D=[xa+sk,yy(xa)+h/2];
    const g=ctx.createLinearGradient(A[0],A[1],C[0],C[1]);g.addColorStop(0,'#0c1f45');g.addColorStop(.5,'#1b3d86');g.addColorStop(1,'#091633');
    poly([A,B,C,D],g,'#8597b3');
    ctx.strokeStyle='rgba(120,170,255,.35)';ctx.lineWidth=.7;
    for(let i=1;i<7;i++){const f=i/7;line([A[0]+(B[0]-A[0])*f,A[1]+(B[1]-A[1])*f],[D[0]+(C[0]-D[0])*f,D[1]+(C[1]-D[1])*f]);}
    for(let i=1;i<3;i++){const f=i/3;line([A[0]+(D[0]-A[0])*f,A[1]+(D[1]-A[1])*f],[B[0]+(C[0]-B[0])*f,B[1]+(C[1]-B[1])*f]);}
    const gf=((t*.07+p*.35+(side>0?.6:0))%1.8)-.3;
    if(gf>0&&gf<1){ctx.save();path([A,B,C,D]);ctx.clip();const gx=A[0]+(B[0]-A[0])*gf;
      const gg=ctx.createLinearGradient(gx-24,0,gx+24,0);gg.addColorStop(0,'rgba(200,230,255,0)');gg.addColorStop(.5,'rgba(210,235,255,.38)');gg.addColorStop(1,'rgba(200,230,255,0)');
      ctx.fillStyle=gg;ctx.fillRect(gx-24,A[1]-60,48,h+120);ctx.restore();}
  }
}
function radiators(t){
  const cx=ST.cx,cy=ST.cy,R=ST.R,lc=`255,${140+40*Math.sin(t*2)|0},70`;
  for(const side of[-1,1])for(let i=0;i<3;i++){
    const y=cy+R*(.4+i*.07),x0=cx+side*R*.06,x1=cx+side*R*(.34-i*.04),h=R*.028;
    const pts=[[x0,y],[x1,y+R*.05],[x1,y+R*.05+h],[x0,y+h]];
    const g=ctx.createLinearGradient(x0,0,x1,0);g.addColorStop(0,'#3a465c');g.addColorStop(1,`rgba(${lc},${.25+.6*reactA})`);
    poly(pts,g,'rgba(160,175,200,.4)');
  }
}
function drones(back,t){
  for(let k=0;k<3;k++){const a=t*(.22+k*.06)+k*2.1;if(!vis(a,back))continue;
    const p=P(ST.R*(1.28+k*.1),a,-ST.R*(.28-k*.22));
    ctx.fillStyle='#9fb0c8';ctx.fillRect(p[0]-4,p[1]-1.5,8,3);ctx.fillStyle='#4c5a72';ctx.fillRect(p[0]-7,p[1]-.5,3,1);ctx.fillRect(p[0]+4,p[1]-.5,3,1);
    if(Math.sin(t*6+k*2)>.4)glow(p[0]+5,p[1],7,k%2?'90,255,140':'255,90,90',1);}
}

function drawStation(dt,t){
  const R=ST.R,lc=S.alert?'255,70,90':'90,240,255';
  const shake=warpA*1.5,cx0=ST.cx,cy0=ST.cy;
  ST.cx+=(Math.random()-.5)*shake;ST.cy+=Math.sin(t*.35)*4+(Math.random()-.5)*shake;
  const cx=ST.cx,cy=ST.cy;
  glow(cx,cy,R*1.4,lc,.05+.16*reactA);
  rot+=dt*(.05+.18*reactA);rot2-=dt*(.08+.3*reactA);
  const OUT={seg:90,nl:130,sparse:9,seams:36,mods:8,mw:R*.075};
  const INN={seg:64,nl:70,sparse:6,seams:24,mods:6,mw:R*.05};
  drones(true,t);
  torus(R,R*.16,R*.075,rot,true,OUT,t,lc);
  torus(R*.58,R*.085,R*.045,rot2,true,INN,t,lc);
  const spokes=[];for(let k=0;k<4;k++)spokes.push(rot+k*Math.PI/2+Math.PI/4);
  const spoke=a=>{const p=P(R*.14,a),q=P(R-R*.08,a);tube(p,q,R*.032);
    if(reactA>.05)for(let i=0;i<4;i++){const f=(t*.5+i/4)%1;glow(p[0]+(q[0]-p[0])*f,p[1]+(q[1]-p[1])*f,R*.028,lc,reactA*(1-f));}};
  spokes.filter(a=>Math.sin(a)<0).forEach(spoke);
  radiators(t);
  solar(-1,cy-R*.45,t);solar(1,cy-R*.45,t);
  // stožár
  ctx.strokeStyle='#7d8fab';ctx.lineWidth=2;line([cx,cy-R*.7],[cx,cy-R*.98]);ctx.lineWidth=1.2;
  line([cx-R*.05,cy-R*.86],[cx+R*.05,cy-R*.86]);line([cx-R*.03,cy-R*.92],[cx+R*.03,cy-R*.92]);
  // věž
  cyl(cy-R*.6,cy-R*.16,R*.062);for(let i=0;i<3;i++)cylRing(cy-R*(.47-i*.1),R*.062);
  for(let i=0;i<5;i++)cylWindows(cy-R*.55+i*R*.075,R*.062,lc,t,3);
  cyl(cy+R*.15,cy+R*.5,R*.072);for(let i=0;i<3;i++)cylRing(cy+R*(.25+i*.08),R*.072);
  for(let i=0;i<4;i++)cylWindows(cy+R*.2+i*R*.08,R*.072,lc,t,3);
  cyl(cy+R*.5,cy+R*.6,R*.125);
  for(let k=-3;k<=3;k++){const th=k*.42,x=cx+R*.125*Math.sin(th),y=cy+R*.56+R*.125*TILT*Math.cos(th);
    ctx.fillStyle='#070b12';ctx.fillRect(x-3,y-3,6,6);ctx.fillStyle=`rgba(120,255,160,${(Math.sin(t*2+k)>0?.9:.25)*Math.cos(th)})`;ctx.fillRect(x-1,y-1,2,2);}
  cyl(cy+R*.6,cy+R*.72,R*.05);
  ctx.fillStyle='#2c3a52';ctx.beginPath();ctx.moveTo(cx-R*.05,cy+R*.72);ctx.lineTo(cx+R*.05,cy+R*.72);ctx.lineTo(cx,cy+R*.86);ctx.closePath();ctx.fill();
  if((t+.6)%1.2<.15)glow(cx,cy+R*.86,R*.05,'120,255,160',1);
  // velitelský modul + parabola
  ctx.strokeStyle='#8a9ab4';ctx.lineWidth=2;line([cx+R*.06,cy-R*.66],[cx+R*.16,cy-R*.74]);
  sphere(cx,cy-R*.64,R*.11);
  for(let k=-5;k<=5;k++){const th=k*.25,x=cx+R*.105*Math.sin(th),y=cy-R*.63+R*.105*.35*Math.cos(th);ctx.fillStyle=`rgba(${lc},${Math.cos(th)*(.3+.7*reactA)})`;ctx.fillRect(x-1.3,y-1,2.6,2);}
  ctx.save();ctx.translate(cx+R*.17,cy-R*.75);ctx.rotate(-.7+Math.sin(t*.3)*.15);
  const dg=ctx.createLinearGradient(-R*.07,0,R*.07,0);dg.addColorStop(0,'#2a3448');dg.addColorStop(.5,'#d3dcea');dg.addColorStop(1,'#3a465c');
  ctx.fillStyle=dg;ctx.beginPath();ctx.ellipse(0,0,R*.07,R*.028,0,0,TAU);ctx.fill();ctx.strokeStyle='#9aa8be';ctx.lineWidth=1;line([0,0],[0,-R*.05]);ctx.restore();
  // reaktorová koule
  sphere(cx,cy,R*.17);
  ctx.strokeStyle='rgba(8,12,20,.8)';ctx.lineWidth=1.2;ctx.beginPath();ctx.ellipse(cx,cy,R*.17,R*.17*TILT,0,0,Math.PI);ctx.stroke();
  ctx.fillStyle='#03060b';ctx.beginPath();ctx.arc(cx,cy+R*.01,R*.1,0,TAU);ctx.fill();
  ctx.strokeStyle='#93a4bf';ctx.lineWidth=2;ctx.stroke();
  glow(cx,cy,R*.55,lc,.06+.45*reactA);
  const pr=R*(.075+.012*Math.sin(t*3)*reactA);
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,pr);g.addColorStop(0,`rgba(255,255,255,${.25+.75*reactA})`);g.addColorStop(.4,`rgba(${lc},${.2+.8*reactA})`);g.addColorStop(1,`rgba(${lc},.05)`);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,pr,0,TAU);ctx.fill();
  ctx.strokeStyle=`rgba(${lc},${.25+.55*reactA})`;ctx.lineWidth=1.4;
  for(let i=0;i<3;i++){ctx.beginPath();ctx.ellipse(cx,cy,R*.23,R*.07,t*(.8+i*.4)+i*1.1,0,TAU);ctx.stroke();}
  if(reactA>.05)for(const dir of[-1,1])for(let i=0;i<2;i++){const f=(t*.7+i*.5)%1;glow(cx,cy+dir*R*(.18+f*.38),R*.045,lc,reactA*(1-f)*.9);}
  spokes.filter(a=>Math.sin(a)>=0).forEach(spoke);
  torus(R*.58,R*.085,R*.045,rot2,false,INN,t,lc);
  torus(R,R*.16,R*.075,rot,false,OUT,t,lc);
  // poziční světla a maják
  if(t%1.6<.18){const l=P(R*1.08,Math.PI,R*.035),r=P(R*1.08,0,R*.035);glow(l[0],l[1],R*.07,'255,60,60',1);glow(r[0],r[1],R*.07,'60,255,120',1);}
  const bc=S.alert?'255,40,60':'255,80,80';
  if((t%1.2)<.15||S.alert&&Math.sin(t*8)>0)glow(cx,cy-R*.98,R*.09,bc,1);
  drones(false,t);
  ST.cx=cx0;ST.cy=cy0;
}

function drawShield(dt,t){
  if(shieldA<.01)return;
  const{cx,cy,rx,ry,hs}=ST;shieldRipple+=dt;
  ctx.save();ctx.globalAlpha=shieldA;
  let g=ctx.createRadialGradient(cx,cy,ry*.5,cx,cy,rx);g.addColorStop(0,'rgba(140,120,255,0)');g.addColorStop(.85,'rgba(140,120,255,.08)');g.addColorStop(1,'rgba(170,150,255,.28)');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,TAU);ctx.fill();
  ctx.clip();
  const rip=shieldRipple*rx*.9;
  for(const h of hexes){
    const d=Math.hypot(h.x,h.y*rx/ry);
    let a=.05+.22*Math.max(0,Math.sin(t*1.5+h.x*.015+h.y*.02+h.ph*.3));
    if(Math.abs(d-rip)<hs*1.5)a+=.6;
    if(Math.random()<.0008)h.hit=1;if(h.hit){a+=h.hit*.8;h.hit=Math.max(0,h.hit-dt*1.5);}
    a*=.4+.6*(d/rx);
    ctx.strokeStyle=`rgba(175,160,255,${a})`;ctx.lineWidth=1;ctx.beginPath();
    for(let k=0;k<6;k++){const an=-Math.PI/2+k*Math.PI/3,x=cx+h.x+Math.cos(an)*hs*.92,y=cy+h.y+Math.sin(an)*hs*.92;k?ctx.lineTo(x,y):ctx.moveTo(x,y);}
    ctx.closePath();ctx.stroke();
  }
  ctx.restore();
  ctx.save();ctx.globalAlpha=shieldA;ctx.strokeStyle='rgba(200,190,255,.6)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,TAU);ctx.stroke();ctx.restore();
}

function drawShips(dt,t){
  nextShip-=dt;
  if(nextShip<=0&&!S.warp){
    nextShip=rand(6,13);const side=Math.random();
    const sx=side<.5?-30:rand(W*.3,W*.6),sy=side<.5?rand(H*.15,H*.4):-30;
    const tx=ST.cx,ty=ST.cy+ST.R*.88,dur=rand(7,11);
    ships.push({x:sx,y:sy,vx:(tx-sx)/dur,vy:(ty-sy)/dur,life:dur,max:dur,name:'K-'+(10+Math.random()*80|0)});
  }
  for(let i=ships.length-1;i>=0;i--){
    const s=ships[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
    if(s.life<=0||S.warp){if(!S.warp)log(`Raketoplán ${s.name} přistál v doku 3`,'');ships.splice(i,1);continue;}
    const ang=Math.atan2(s.vy,s.vx),fade=Math.min(1,s.life/1.2,(s.max-s.life)/1);
    ctx.save();ctx.translate(s.x,s.y);ctx.rotate(ang);ctx.globalAlpha=fade;
    const g=ctx.createLinearGradient(-40,0,0,0);g.addColorStop(0,'rgba(90,200,255,0)');g.addColorStop(1,'rgba(150,230,255,.8)');
    ctx.strokeStyle=g;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-40,0);ctx.lineTo(-6,0);ctx.stroke();
    ctx.fillStyle='#b8c6da';ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(-5,-4);ctx.lineTo(-3,0);ctx.lineTo(-5,4);ctx.closePath();ctx.fill();
    if(Math.sin(t*10+i)>0){ctx.fillStyle='#ff5a5a';ctx.fillRect(-5,-5,2,2);ctx.fillStyle='#5aff8a';ctx.fillRect(-5,3,2,2);}
    ctx.restore();
  }
}

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  reactA=lerp(reactA,+S.reactor,1.2,dt);shieldA=lerp(shieldA,+S.shield,2,dt);warpA=lerp(warpA,+S.warp,1.5,dt);
  scanA=lerp(scanA,+S.scan,2,dt);alertA=lerp(alertA,+S.alert,3,dt);
  speed=lerp(speed,S.warp?.03:.00025,S.warp?.9:1.6,dt);
  sweep+=dt*1.6;if(sweep>TAU){sweep-=TAU;if(S.scan)tone(1500,.25,'sine',.04);}
  ctx.drawImage(bgNeb,0,0,W,H);
  drawStars(dt,t);
  ctx.save();ctx.globalAlpha=1-warpA*.35;ctx.drawImage(bgPlan,0,0,W,H);ctx.restore();
  drawDNA(dt,t);
  drawScanner(dt,t);
  drawShips(dt,t);
  drawStation(dt,t);
  drawShield(dt,t);
  if(warpA>.01){const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.2,W/2,H/2,Math.max(W,H)*.7);g.addColorStop(0,'rgba(80,140,255,0)');g.addColorStop(1,`rgba(80,140,255,${.22*warpA})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
  if(alertA>.01){ctx.fillStyle=`rgba(255,0,40,${alertA*.07*(.5+.5*Math.sin(t*4.5))})`;ctx.fillRect(0,0,W,H);}
  if(flash>.01){ctx.fillStyle=`rgba(220,235,255,${flash*.5})`;ctx.fillRect(0,0,W,H);flash-=dt*1.5;}
  requestAnimationFrame(frame);
}

/* ================= TELEMETRIE ================= */
const $=id=>document.getElementById(id);
const tel={pwr:0,shd:0,spd:0,tmp:0,grv:0,o2:98};
function setRow(k,txt,pct){$('v-'+k).textContent=txt;$('b-'+k).style.width=Math.max(0,Math.min(100,pct))+'%';}
setInterval(()=>{
  const j=()=>(Math.random()-.5);
  tel.pwr+=((S.reactor?93+j()*4:6+j()*2)-tel.pwr)*.25;
  tel.shd+=((S.shield?(S.reactor?100:38):0)-tel.shd)*.2;
  tel.spd+=((S.warp?9.42+j()*.1:.02)-tel.spd)*.15;
  tel.tmp+=((S.reactor?4800+j()*120:310)-tel.tmp)*.12;
  tel.grv+=((S.reactor?1:.42)-tel.grv)*.08;
  tel.o2=Math.max(95,Math.min(99.9,tel.o2+j()*.15));
  setRow('pwr',tel.pwr.toFixed(0)+' %',tel.pwr);
  setRow('shd',tel.shd.toFixed(0)+' %',tel.shd);
  setRow('spd',(tel.spd<1?tel.spd.toFixed(2):tel.spd.toFixed(1))+' c',tel.spd/10*100);
  setRow('tmp',Math.round(tel.tmp)+' K',tel.tmp/5200*100);
  setRow('grv',tel.grv.toFixed(2)+' g',tel.grv*100);
  setRow('o2',tel.o2.toFixed(1)+' %',tel.o2);
},300);
function clock(){const d=new Date();$('clock').textContent=d.toLocaleTimeString('cs-CZ');$('date').textContent=d.toLocaleDateString('cs-CZ',{weekday:'long',day:'numeric',month:'long'})+' · hvězdné datum '+(d.getFullYear()-1946)+'.'+String(Math.floor((d-new Date(d.getFullYear(),0,1))/864e5)).padStart(3,'0');}
setInterval(clock,1000);clock();

const chatter=[
  ()=>['Hydroponie: sklizeň 14 % nad plán','ok'],
  ()=>['Kalibrace dálkových senzorů dokončena',''],
  ()=>S.shield?['Mikrometeorit zachycen štíty – bez poškození','ok']:['Mikrometeorit zasáhl modul C – drobné poškození trupu','w'],
  ()=>['Recyklace vody: účinnost 99,2 %',''],
  ()=>['Komunikační okno se Zemí otevřeno – zpoždění 4,2 roku',''],
  ()=>S.reactor?['Stabilita plazmatu 99,8 %','ok']:['Záložní baterie: 61 % kapacity','w'],
  ()=>['Údržbářský dron D-7 dokončil inspekci prstence',''],
  ()=>S.scan?['Skener: na povrchu detekován neznámý signál','w']:['Kontrola atmosféry modulu B – v normě',''],
  ()=>['Biolaboratoř: vzorek 7G-α stabilní, replikace DNA v normě','ok'],
  ()=>['Posádka: směna Gamma nastoupila na můstek','']
];
(function loop(){setTimeout(()=>{const m=chatter[Math.random()*chatter.length|0]();log(m[0],m[1]);loop();},rand(9000,16000));})();

/* ================= START ================= */
addEventListener('resize',resize);
resize();refreshUI();requestAnimationFrame(frame);
[['Systémy můstku inicializovány','ok'],['Spojení s orbitální sítí navázáno',''],['Tip: klávesy 1–5 = spínače, H nebo dvojklik = skrýt panely','']].forEach((m,i)=>setTimeout(()=>log(m[0],m[1]),400+i*900));
})();
